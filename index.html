    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite dev server WebSocket connection errors in environments where HMR is disabled
      window.addEventListener('error', function(event) {
        if (
          event.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
        var stack = event.reason && event.reason.stack ? String(event.reason.stack) : '';
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
