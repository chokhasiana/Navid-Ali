<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <radialGradient id="deep-dark" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c0d11" />
      <stop offset="70%" stop-color="#050608" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>
    <linearGradient id="stem-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.3" />
    </linearGradient>
    <filter id="flora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#deep-dark)" />

  <!-- Botanical fractal lattice stems -->
  <g stroke="url(#stem-grad)" fill="none" opacity="0.85">
    <!-- Main central spine -->
    <path d="M 600,850 Q 590,550 600,200" stroke-width="4" />
    
    <!-- Primary fractal arches -->
    <path d="M 600,680 Q 480,620 400,520 Q 350,440 370,340" stroke-width="2.5" />
    <path d="M 600,680 Q 720,620 800,520 Q 850,440 830,340" stroke-width="2.5" />

    <path d="M 600,520 Q 510,480 460,380 Q 440,300 480,240" stroke-width="2" />
    <path d="M 600,520 Q 690,480 740,380 Q 760,300 720,240" stroke-width="2" />

    <path d="M 600,380 Q 540,320 520,240 Q 530,180 570,140" stroke-width="1.5" />
    <path d="M 600,380 Q 660,320 680,240 Q 670,180 630,140" stroke-width="1.5" />
  </g>

  <!-- Secondary capillary filaments -->
  <g stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M 400,520 C 320,490 280,410 290,320" />
    <path d="M 800,520 C 880,490 920,410 910,320" />
    <path d="M 460,380 C 400,330 380,260 410,200" />
    <path d="M 740,380 C 800,330 820,260 790,200" />
    <path d="M 520,240 C 480,200 480,150 510,110" />
    <path d="M 680,240 C 720,200 720,150 690,110" />
  </g>

  <!-- Luminous golden spore nodes -->
  <g filter="url(#flora-glow)">
    <circle cx="600" cy="200" r="5" fill="#ffffff" />
    <circle cx="370" cy="340" r="4" fill="url(#gold-leaf)" />
    <circle cx="830" cy="340" r="4" fill="url(#gold-leaf)" />
    <circle cx="480" cy="240" r="3.5" fill="#fde047" />
    <circle cx="720" cy="240" r="3.5" fill="#fde047" />
    <circle cx="570" cy="140" r="3" fill="#ffffff" />
    <circle cx="630" cy="140" r="3" fill="#ffffff" />
    <circle cx="290" cy="320" r="2.5" fill="#7dd3fc" />
    <circle cx="910" cy="320" r="2.5" fill="#7dd3fc" />
    <circle cx="410" cy="200" r="2" fill="#7dd3fc" />
    <circle cx="790" cy="200" r="2" fill="#7dd3fc" />
  </g>

  <!-- Ambient light particle aura -->
  <circle cx="600" cy="400" r="250" fill="#38bdf8" opacity="0.04" />
</svg>
