<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="singularity-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="85%" stop-color="#020202" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="78%" stop-color="#000000" stop-opacity="0" />
      <stop offset="82%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="86%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="89%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="ring-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Absolute obsidian backdrop -->
  <rect width="1000" height="1000" fill="#040405" />

  <!-- The Ring of Minimal Light (Event Horizon) -->
  <circle cx="500" cy="500" r="320" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" filter="url(#ring-blur)" />
  <circle cx="500" cy="500" r="322" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4" />
  
  <!-- Subtle gravitational shear ring glow -->
  <rect width="1000" height="1000" fill="url(#ring-glow)" />

  <!-- Pitch Black Void Center -->
  <circle cx="500" cy="500" r="316" fill="url(#singularity-core)" />

  <!-- Single offset micro-specular refraction -->
  <circle cx="680" cy="380" r="1.5" fill="#ffffff" opacity="0.9" />
</svg>
